ho seek greater responsibility and influence within the Order. They are respected for their strength, knowledge, and presence. Many aspire to this rank, but few are deemed worthy."},{title:"Eternal Path-Leader",symbol:"△",echelon:"III",desc:"The master of a pathway, responsible for guiding, training, and shaping all within their domain. They conduct trials, enforce standards, and ensure their path remains strong and disciplined. Their decisions directly impact the growth and success of their members. They are both leaders and symbols of their path's power."},{title:"Eternal Apprentice",symbol:"△",echelon:"III",desc:"Chosen directly by the Path-Leader, these individuals are seen as future successors. They are trained closely, learning not only skill but leadership and judgment. Expectations are high, and failure is not easily tolerated. They walk the line between student and future ruler."},{title:"Sith Phantom",symbol:"✧",echelon:"III",desc:"A retired figure of former power who has stepped away from active duty. Though no longer leading, their legacy continues to influence the Order. They are respected as echoes of past strength and experience. Their presence is rare, but never forgotten."},{title:"Sith Curator",symbol:"◍",echelon:"III",desc:"An ascended form of the Soul-Reclaimer, representing the highest level of defensive mastery within the Order. These individuals have surpassed standard limits of endurance and control, becoming nearly unbreakable in both presence and combat. To reach this rank, one must first become an Eternal Apprentice of the Soul-Reclaimer path and be personally handpicked by a Sith Master or the Emperor. Their role is rare, respected, and only granted to those who embody absolute resilience."},{title:"Sith Inquisitor",symbol:"†",echelon:"III",desc:"The ascended evolution of the Enforcer, wielding unmatched authority over law, discipline, and judgment. Sith Inquisitors do not simply enforce rules—they define and embody them, acting as feared arbiters within the Order. Candidates must prove themselves as an Eternal Apprentice of the Enforcer path and be chosen by a Sith Master or the Emperor. Their presence alone commands obedience, and their judgment is rarely questioned."},{title:"Sith Wraith",symbol:"⬔",echelon:"III",desc:"An ascended rank granted to the most elite of Shadow Walkers and Elliptical Warriors, combining stealth, lethality, and elite combat discipline. These individuals move beyond standard roles, becoming near-untraceable forces of precision and control. To attain this rank, one must be an Eternal Apprentice of the corresponding path and be handpicked by a Sith Master or the Emperor. They are rarely seen, but their actions leave lasting impact across the Order."}]},{echelon:"II",label:"ECHELON II — PATHWAYS",sub:"Permanent callings. Guardians, hunters, enforcers, and the unbreakable.",ranks:[{title:"Elliptical Warrior",symbol:"☤",echelon:"II",desc:"Guardians of the upper echelon, entrusted with protecting the highest ranks of the Order. Their skill, discipline, and awareness must be flawless. They stand as the final line between order and chaos within the hierarchy. Only the most elite are allowed to take this role."},{title:"Shadow Walker",symbol:"◐",echelon:"II",desc:"Hunters who operate in silence, specializing in tracking and eliminating targets. They rely on precision, patience, and unpredictability in combat. Their presence is often unknown until it is too late. Fear follows wherever they move."},{title:"Enforcer",symbol:"⚖",echelon:"II",desc:"The embodiment of law within the Order, maintaining discipline and structure among all members. They ensure rules are followed and punish those who break them. Their authority is respected, and their judgment carries weight. Without them, order would collapse."},{title:"Soul-Reclaimer",symbol:"\uD83D\uDF19",echelon:"II",desc:"A defensive force built on endurance and resilience, capable of outlasting any opponent. They absorb pressure, control the battlefield, and turn defense into victory. Their strength lies not in speed, but in their unbreakable will. Facing one is a battle of attrition few survive."},{title:"Elite Knight",symbol:"⟡",echelon:"II",desc:"A proving ground for those preparing to enter a permanent pathway. Members refine combat, discipline, and awareness while being observed for potential assignment. This role does not bind you to a path but prepares you for one. Performance here heavily influences your future placement."}]},{echelon:"I",label:"ECHELON I — INITIATION (THE CRUCIBLE)",sub:"The foundation. Where potential is separated from failure.",ranks:[{title:"Core Forces IV",symbol:"▽",echelon:"I",desc:"The final stage before ascension, where members are tested on law, discipline, and full understanding of the Order. This is where the Trial of Ascendency awaits, determining their permanent fate. Only those who prove themselves worthy move forward. Failure here means repeating the crucible."},{title:"Core Forces III",symbol:"▽",echelon:"I",desc:"Focused on refining combat ability and awareness in increasingly difficult scenarios. Members are pushed beyond their limits to test adaptability and control. Mistakes are corrected through repetition and pressure. Strength begins to take form here."},{title:"Core Forces II",symbol:"▽",echelon:"I",desc:"Introduces deeper understanding of pathways and their roles within the Order. Members begin to recognize where they may belong, though nothing is guaranteed. Knowledge and observation are key at this stage. Every action is watched and evaluated."},{title:"Core Forces I",symbol:"▽",echelon:"I",desc:"The foundation of discipline and structured training within the Order. Members begin to understand expectations, basic combat flow, and the importance of control. Weakness is exposed early, and improvement is demanded. This stage separates potential from failure."},{title:"New Initiate",symbol:"\uD83D\uDF03",echelon:"I",desc:"The beginning of all paths
